name: 毎日の買取価格記録

on:
  schedule:
    - cron: "40 22 * * *"   # 毎日 日本時間 7:40
  workflow_dispatch:

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 必要なライブラリを入れる
        run: pip install -r requirements.txt

      - name: 価格を取得して記録する
        run: python scraper.py

      - name: 記録を保存する
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "価格記録 $(TZ=Asia/Tokyo date +%Y-%m-%d)"
          git push

      - name: 失敗したときに調査用ファイルを残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug
          path: debug/
          if-no-files-found: ignore
